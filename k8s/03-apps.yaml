apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: orderflow/auth:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: orderflow-config
            - secretRef:
                name: orderflow-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: orderflow
spec:
  selector:
    app: auth
  ports:
    - port: 8080
      targetPort: 8080

